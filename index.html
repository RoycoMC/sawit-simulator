
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAWIT SIMULATOR 2.5D</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#8fca69;color:white;overflow:hidden}
header{background:#205b2c;padding:12px;display:flex;justify-content:space-between;font-weight:bold}
#scene{height:65vh;position:relative;overflow:hidden;background:linear-gradient(#8ed4ed 0 35%,#70ad4b 35%)}
.ground{position:absolute;left:-20%;top:38%;width:140%;height:90%;background:repeating-linear-gradient(30deg,#8bc65e 0 40px,#79b64f 41px 43px);transform:perspective(400px) rotateX(12deg)}
.tree{position:absolute;width:100px;height:140px;transform:translate(-50%,-50%)}
.trunk{position:absolute;bottom:0;left:44px;width:13px;height:80px;background:#88542d;transform:skew(-5deg)}
.leaves{position:absolute;left:48px;top:5px;width:8px;height:85px;background:#24612b;transform-origin:bottom;box-shadow:0 0 0 0 #24612b}
.leaves:before,.leaves:after{content:"";position:absolute;width:72px;height:12px;background:#347e32;border-radius:100%;left:-65px;top:10px;transform:rotate(-28deg)}
.leaves:after{left:0;top:0;transform:rotate(28deg)}
.fruit{position:absolute;top:62px;left:42px;color:#ff681d;font-size:22px}
#player{position:absolute;left:50%;top:65%;font-size:30px;transform:translate(-50%,-50%)}
#controls{padding:10px;background:#e5edcf;color:#173b20;height:35vh;overflow:auto}
.row{display:flex;justify-content:center;gap:7px;margin:7px}
button{border:0;border-radius:10px;padding:12px;background:#246b36;color:white;font-weight:bold}
.move{width:55px;font-size:20px}
.actions button{flex:1;font-size:12px}
#msg{text-align:center;font-weight:bold;min-height:20px}
</style>
</head>
<body>
<header><span>🌴 SAWIT SIMULATOR 2.5D</span><span id="money">Rp100K</span></header>
<div id="scene">
<div class="ground"></div>
<div class="tree" style="left:25%;top:45%"><div class="trunk"></div><div class="leaves"></div><div class="fruit">🟠</div></div>
<div class="tree" style="left:72%;top:42%;transform:translate(-50%,-50%) scale(.8)"><div class="trunk"></div><div class="leaves"></div><div class="fruit">🟠</div></div>
<div class="tree" style="left:32%;top:72%;transform:translate(-50%,-50%) scale(.7)"><div class="trunk"></div><div class="leaves"></div><div class="fruit">🟠</div></div>
<div id="player">🧑🏻‍🌾</div>
</div>
<div id="controls">
<div id="msg">Jalan-jalan di kebun dan panen sawit!</div>
<div class="row">
<button class="move" onclick="move(0,-20)">⬆️</button>
</div>
<div class="row">
<button class="move" onclick="move(-20,0)">⬅️</button>
<button class="move" onclick="move(0,20)">⬇️</button>
<button class="move" onclick="move(20,0)">➡️</button>
</div>
<div class="row actions">
<button onclick="harvest()">🌴 PANEN</button>
<button onclick="sell()">💰 JUAL</button>
</div>
<div class="row actions">
<button onclick="buyLand()">🟩 BELI LAHAN 500K</button>
<button onclick="plant()">🌱 BIBIT 1K</button>
<button onclick="fertilize()">🧪 PUPUK 50K</button>
</div>
</div>
<script>
let money=100000,fruit=0,trees=3,x=50,y=65;
const player=document.getElementById('player');
function update(){document.getElementById('money').textContent='Rp'+Math.floor(money/1000)+'K'}
function say(t){document.getElementById('msg').textContent=t}
function move(a,b){x=Math.max(5,Math.min(95,x+a));y=Math.max(10,Math.min(90,y+b));player.style.left=x+'%';player.style.top=y+'%'}
function harvest(){fruit++;say('Panen berhasil! Tandan: '+fruit)}
function sell(){if(!fruit){say('Belum ada sawit untuk dijual!');return}money+=fruit*25000;say('Sawit terjual! +Rp'+(fruit*25)+'K');fruit=0;update()}
function buyLand(){if(money<500000){say('Uang belum cukup! Butuh Rp500K');return}money-=500000;trees++;let t=document.createElement('div');t.className='tree';t.style.left=(15+Math.random()*70)+'%';t.style.top=(40+Math.random()*35)+'%';t.innerHTML='<div class="trunk"></div><div class="leaves"></div><div class="fruit">🟠</div>';document.getElementById('scene').appendChild(t);update();say('Lahan baru dibeli!')}
function plant(){if(money<1000){say('Uang kurang!');return}money-=1000;trees++;let t=document.createElement('div');t.className='tree';t.style.left=(10+Math.random()*80)+'%';t.style.top=(40+Math.random()*40)+'%';t.innerHTML='<div class="trunk"></div><div class="leaves"></div>';document.getElementById('scene').appendChild(t);update();say('Bibit ditanam!');setTimeout(()=>{t.innerHTML='<div class="trunk"></div><div class="leaves"></div><div class="fruit">🟠</div>';say('Pohon siap dipanen!')},8000)}
function fertilize(){if(money<50000){say('Uang kurang! Butuh Rp50K');return}money-=50000;update();say('Pupuk diberikan ke kebun!')}
update();
</script>
</body>
  </html>
