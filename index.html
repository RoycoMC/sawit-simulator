<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SAWIT SIMULATOR</title>
<style>
:root{--green:#246b36;--lime:#7ed957;--gold:#ffc857;--dark:#173321}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(#9edcff 0 35%,#7bbd53 35% 100%);color:#142719;min-height:100vh}.top{background:#174b2a;color:white;padding:14px 16px;text-align:center;box-shadow:0 3px 8px #0003}.top h1{font-size:22px;margin:0}.top p{margin:3px 0 0;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}.stat,.panel{background:#ffffffed;border:2px solid #d6e9d1;border-radius:12px;padding:10px;box-shadow:0 3px 8px #0002}.stat small{display:block;color:#54705a;font-size:11px}.stat strong{font-size:16px}.field{margin:0 10px 10px;background:#8fce62;border:3px solid #4d8e3c;border-radius:14px;padding:12px;min-height:260px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-content:start}.tree{border:2px solid #579448;border-radius:12px;background:#c6ef9d;min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px;color:#173321;font-weight:700}.tree .emoji{font-size:38px;line-height:1}.tree small{font-size:10px;font-weight:600}.tree:active,button:active{transform:scale(.97)}.panel{margin:0 10px 10px}.panel h2{font-size:16px;margin:0 0 8px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button{border:0;border-radius:10px;padding:12px 8px;font-size:14px;font-weight:800;background:var(--green);color:white;box-shadow:0 3px 0 #123e22;cursor:pointer}button.gold{background:#e7a923;color:#302308;box-shadow:0 3px 0 #a56d0a}button.blue{background:#2875a6;box-shadow:0 3px 0 #174866}.hint{font-size:12px;color:#526753;margin:8px 0 0}.log{font-size:12px;min-height:18px;color:#285536}.footer{text-align:center;font-size:11px;padding:4px 12px 16px;color:#254b2c}@media(min-width:600px){main{max-width:600px;margin:auto}.field{min-height:300px}}
</style></head><body>
<header class="top"><h1>🌴 SAWIT SIMULATOR</h1><p>Bangun kebun sawitmu sendiri!</p></header><main>
<section class="stats"><div class="stat"><small>💵 UANG</small><strong id="money">Rp100.000</strong></div><div class="stat"><small>🌴 POHON</small><strong id="count">3</strong></div><div class="stat"><small>🧺 TANDAN</small><strong id="fruit">0</strong></div></section>
<div class="field" id="field" aria-label="Kebun sawit"></div>
<section class="panel"><h2>🛠️ Aksi Kebun</h2><div class="buttons"><button id="harvest">🧺 Panen semua</button><button class="gold" id="sell">💰 Jual tandan</button><button class="blue" id="land">🗺️ Beli lahan — Rp500.000</button><button id="seed">🌱 Beli bibit — Rp1.000</button><button class="gold" id="fert">🧪 Pupuk — Rp50.000</button><button class="blue" id="tractor">🚜 Traktor: OFF</button></div><p class="hint">Ketuk pohon yang siap panen. Pohon tumbuh kembali dalam 30 detik.</p><p class="log" id="log">Selamat datang! Panen sawit untuk mulai mencari uang.</p></section>
</main><div class="footer">Versi uji coba offline • Progres tersimpan otomatis di browser</div>
<script>
(()=>{const $=id=>document.getElementById(id);let saved;try{saved=JSON.parse(localStorage.getItem('sawitSaveV2')||'null')}catch(e){};let state=saved||{money:100000,trees:[{ready:true},{ready:true},{ready:true}],fruit:0,land:1,tractor:false};const fmt=n=>'Rp'+Math.floor(n).toLocaleString('id-ID');function save(){try{localStorage.setItem('sawitSaveV2',JSON.stringify(state))}catch(e){}}function log(t){$('log').textContent=t}function render(){ $('money').textContent=fmt(state.money);$('count').textContent=state.trees.length;$('fruit').textContent=state.fruit;$('tractor').textContent='🚜 Traktor: '+(state.tractor?'ON':'OFF');const f=$('field');f.innerHTML='';state.trees.forEach((t,i)=>{const b=document.createElement('button');b.className='tree';b.style.background=t.ready?'#c6ef9d':'#e5e9c7';b.innerHTML='<span class="emoji">'+(t.ready?'🌴':'🌱')+'</span><span>Pohon '+(i+1)+'</span><small>'+(t.ready?'SIAP PANEN':'TUMBUH...')+'</small>';b.onclick=()=>harvestOne(i);f.appendChild(b)});save()}function harvestOne(i){let t=state.trees[i];if(!t.ready){log('Pohon ini belum siap. Tunggu sampai tumbuh kembali!');return}t.ready=false;state.fruit+=1;log('Berhasil panen 1 tandan! Pohon tumbuh lagi dalam 30 detik.');render();setTimeout(()=>{if(state.trees[i]){state.trees[i].ready=true;render();log('Pohon '+(i+1)+' sudah tumbuh kembali!')}},30000)}$('harvest').onclick=()=>{let n=0;state.trees.forEach((t,i)=>{if(t.ready){t.ready=false;state.fruit++;n++;setTimeout(()=>{if(state.trees[i]){state.trees[i].ready=true;render()}},30000)} });render();log(n?'Panen '+n+' tandan berhasil!':'Belum ada pohon yang siap dipanen.');};$('sell').onclick=()=>{if(!state.fruit){log('Belum ada tandan untuk dijual. Panen dulu!');return}let n=state.fruit;state.money+=n*25000;state.fruit=0;render();log('Terjual '+n+' tandan, kamu mendapat '+fmt(n*25000)+'!')};$('land').onclick=()=>{if(state.money<500000){log('Uang belum cukup untuk beli lahan (Rp500.000).');return}state.money-=500000;state.land++;for(let i=0;i<3;i++)state.trees.push({ready:false});render();log('Lahan baru dibeli! 3 bibit pohon ditanam.');state.trees.slice(-3).forEach((t,j)=>setTimeout(()=>{t.ready=true;render()},15000+j*3000))};$('seed').onclick=()=>{if(state.money<1000){log('Uang belum cukup untuk bibit.');return}state.money-=1000;state.trees.push({ready:false});let idx=state.trees.length-1;render();log('Bibit ditanam! Siap panen dalam 15 detik.');setTimeout(()=>{if(state.trees[idx]){state.trees[idx].ready=true;render();log('Bibit baru siap dipanen!')}},15000)};$('fert').onclick=()=>{if(state.money<50000){log('Uang belum cukup untuk membeli pupuk (Rp50.000).');return}state.money-=50000;state.trees.forEach(t=>t.ready=true);render();log('Pupuk digunakan! Semua pohon langsung siap panen.')};$('tractor').onclick=()=>{state.tractor=!state.tractor;render();log(state.tractor?'Traktor aktif! (fitur visual uji coba)':'Traktor dimatikan.')};render()})();
</script></body></html>
